name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: hwpx-c2pa fetch-lib
      - run: hwpx-c2pa info
      - run: pytest -q
  addon-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -A Win32 -S addon/windows/useraction -B build
      - run: cmake --build build --config Release
